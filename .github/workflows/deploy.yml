# SI-generated: written by Claude Code (Anthropic) for the SunSight team. See SI_USE.md.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # While real data is incomplete the site may carry fixture data and shows a banner.
      # Once web/public/data/manifest.json exists, the release check (no fixture files) is enforced.
      - run: |
          if [ -f web/public/data/manifest.json ]; then cd web && npm run build:release; else cd web && npm run build; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
