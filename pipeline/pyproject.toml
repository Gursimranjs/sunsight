# SI-generated: written by Claude Code (Anthropic) for the SunSight team. See SI_USE.md.
[project]
name = "sunsight"
version = "0.1.0"
description = "SunSight pipeline: Sun, Earth and station geometry, terrain horizons and light maths for lunar landing sites"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "spiceypy>=6.0",
  "numba>=0.60",
  "rasterio>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyproj>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunsight"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: needs downloaded kernels or terrain; skipped in fast CI when data is absent",
]
